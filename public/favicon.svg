<svg xmlns="http://www.w3.org/2000/svg" viewBox="78 84 360 360">
  <rect width="512" height="512" fill="#004745"/>
  <!-- dirt pile, edge to edge -->
  <path d="M0 448 Q50 420 96 404 Q130 392 160 386 L420 384 Q462 370 492 382 Q506 392 512 404 L512 512 L0 512 Z" fill="#2b2118"/>
  <path d="M24 470 Q70 438 110 424 Q140 416 168 420 Q130 440 90 470 Z" fill="#3d2e21"/>
  <path d="M380 420 Q430 406 470 414 Q440 430 400 436 Z" fill="#3d2e21"/>
  <g transform="translate(-14 4) scale(1.04)">
    <!-- falling dirt -->
    <g fill="#3d2e21"><circle cx="134" cy="364" r="5"/><circle cx="122" cy="378" r="4"/><circle cx="146" cy="372" r="3.5"/></g>
    <!-- tracks -->
    <rect x="168" y="338" width="236" height="42" rx="21" fill="#D4A070"/>
    <rect x="180" y="348" width="212" height="22" rx="11" fill="#7a5c3c"/>
    <g fill="#D4A070"><circle cx="198" cy="359" r="8"/><circle cx="242" cy="359" r="6"/><circle cx="286" cy="359" r="6"/><circle cx="330" cy="359" r="6"/><circle cx="374" cy="359" r="8"/></g>
    <!-- upper house with counterweight -->
    <path d="M188 332 L188 292 Q188 284 196 284 L390 284 Q408 284 410 300 L412 322 Q412 332 402 332 Z" fill="#D4A070"/>
    <rect x="188" y="330" width="224" height="6" fill="#9c7650"/>
    <g fill="#9c7650"><rect x="338" y="294" width="54" height="5" rx="2"/><rect x="338" y="304" width="54" height="5" rx="2"/><rect x="338" y="314" width="54" height="5" rx="2"/></g>
    <!-- cab, behind the boom -->
    <path d="M222 286 L222 222 Q222 216 228 216 L290 216 Q296 216 296 222 L296 286 Z" fill="#D4A070"/>
    <path d="M232 280 L232 226 L288 226 L288 280 Z" fill="#0f2b2a"/>
    <path d="M258 226 L262 226 L262 280 L258 280 Z" fill="#D4A070"/>
    <!-- boom: rises from in front of the cab and arches forward -->
    <path d="M214 300 C214 222 196 160 146 108" stroke="#D4A070" stroke-width="34" stroke-linecap="round" fill="none"/>
    <path d="M214 300 C214 222 196 160 146 108" stroke="#9c7650" stroke-width="2" fill="none" transform="translate(13 4)"/>
    <!-- boom cylinder -->
    <path d="M236 318 L222 230" stroke="#D4A070" stroke-width="10" stroke-linecap="round"/>
    <path d="M236 318 L222 230" stroke="#0f2b2a" stroke-width="3"/>
    <!-- stick: hangs almost straight down -->
    <path d="M144 104 L134 290" stroke="#D4A070" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M156 118 L152 244" stroke="#0f2b2a" stroke-width="5" stroke-linecap="round"/>
    <!-- bucket, curled under, teeth toward the machine -->
    <path d="M110 288 L162 282 Q172 306 166 332 L162 348 L154 342 L148 354 L140 346 L132 358 L126 348 Q100 326 104 298 Z" fill="#D4A070"/>
    <circle cx="134" cy="290" r="7" fill="#004745"/>
  </g>
</svg>
